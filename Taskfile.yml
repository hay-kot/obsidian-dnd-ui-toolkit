version: "3"
dotenv:
  - .env

vars:
  VAULT: ./scripts/dev-vault.sh

tasks:
  dev:
    desc: Build the plugin and install it into this clone's dev vault slot
    deps: [build:plugin]
    cmds:
      # Always runs, even when the build is a cache hit: the slot may be new, or the
      # notes may have changed, or another clone may have taken over the plugin dir.
      - "{{.VAULT}} setup"
      - |
        PLUGIN_DIR="${PLUGIN_DIR:-$({{.VAULT}} plugin-dir)}"
        mkdir -p "$PLUGIN_DIR"
        cp -f main.js manifest.json "$PLUGIN_DIR/"
        if [ -f styles.css ]; then cp -f styles.css "$PLUGIN_DIR/"; fi
        echo "Installed to $PLUGIN_DIR"

  build:plugin:
    internal: true
    cmds:
      - npm run build
    sources:
      - "**/*.ts"
      - "**/*.vue"
      - "**/*.css"
      - "!node_modules/**/*"
      - "!dist/**/*"
    generates:
      - "main.js"
      - "styles.css"

  dev:open:
    desc: Open this clone's dev vault slot in Obsidian
    cmds:
      - "{{.VAULT}} open"

  dev:register:
    desc: Register the dev vault slots with Obsidian (run once, with Obsidian closed)
    cmds:
      - "{{.VAULT}} register"

  dev:status:
    desc: Show which clone holds each dev vault slot
    cmds:
      - "{{.VAULT}} status"

  dev:release:
    desc: Give up this clone's dev vault slot so another clone can take it
    cmds:
      - "{{.VAULT}} release"

  check:
    desc: Run all checks - format, lint, type check, and test
    cmds:
      - npm run format
      - npm run lint
      - npm run typecheck
      - npm run test
